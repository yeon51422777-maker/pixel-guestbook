<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>픽셀 방명록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#121216;--panel:#1c1c22;--line:#34343f;--text:#f1f1f4;--sub:#a7a7b3;--acc:#7bd36a;--acc2:#ffd257}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Galmuri11','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
button{font-family:inherit;cursor:pointer}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 18px;border:2px solid #000;border-radius:12px;background:var(--acc);color:#10210b;font-size:16px;font-weight:700;box-shadow:0 4px 0 #2f6b26}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2f6b26}
.btn.ghost{background:#2a2a33;color:var(--text);box-shadow:0 4px 0 #0c0c10;border-color:#44444f}
.btn.danger{background:#e2574c;color:#fff;box-shadow:0 4px 0 #8c2a22}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-size:14px;border:2px solid #444}
/* 모바일 */
body.mobile{min-height:100dvh}
.phone{max-width:460px;margin:0 auto;padding:22px 16px 40px;min-height:100dvh;display:flex;flex-direction:column;gap:16px}
.phone.wide{max-width:640px}
.box{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.g-title{font-size:24px;line-height:1.3;text-align:center}
.g-sub{color:var(--sub);text-align:center;font-size:14px;line-height:1.6}
.center{display:flex;flex-direction:column;align-items:center;gap:12px}
.builder{display:flex;flex-direction:column;gap:12px}
.pvwrap{display:flex;flex-direction:column;align-items:center;gap:10px;background:radial-gradient(#2f5428,#162414);border:2px solid var(--line);border-radius:16px;padding:16px}
.pv{height:150px;width:auto}
.pvwrap.stick{padding:10px}
.pvwrap.stick{position:sticky;top:0;z-index:5}
.minirow{display:flex;gap:8px}
.btn.mini{padding:8px 12px;font-size:13px}
.secs{display:flex;flex-direction:column;gap:18px}
.sec-t{font-size:14px;color:var(--acc2);margin-bottom:8px}
.sec-n{font-size:12px;color:var(--sub);margin:-4px 0 8px;line-height:1.5}
.joy{width:180px;height:180px;border-radius:50%;background:radial-gradient(#2c2c36,#17171c);border:3px solid var(--line);position:relative;touch-action:none;margin:4px auto;user-select:none;-webkit-user-select:none}
.joy:before{content:'▲';position:absolute;top:8px;left:50%;transform:translateX(-50%);color:#555}
.joy:after{content:'▼';position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#555}
.knob{width:72px;height:72px;border-radius:50%;background:var(--acc2);border:3px solid #000;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 4px 0 #a07f1a;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 11px;border-radius:99px;border:2px solid var(--line);background:#24242c;color:var(--text);font-size:13px}
.chip.on{background:var(--acc2);color:#2a2000;border-color:#000}
.me{display:flex;align-items:center;gap:12px}
.me canvas{height:84px;width:auto}
.sendrow{display:flex;gap:8px}
.sendrow .in{flex:1;min-width:0}
.sendrow .btn{flex:0 0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;padding:9px 13px;border-radius:10px;border:2px solid var(--line);background:#24242c;color:var(--sub);font-size:14px}
.tab.on{background:var(--acc2);color:#2a2000;border-color:#000}
.opts{display:grid;gap:8px}
.opts.shapes,.opts.crops{grid-template-columns:repeat(4,1fr)}
.opts.colors{grid-template-columns:repeat(7,1fr)}
.op{background:#24242c;border:2px solid var(--line);border-radius:12px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.op canvas{height:76px;width:auto}
.opts.crops .op canvas{height:54px}
.op span{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.op.on span{color:var(--acc2)}
.op.on,.sw.on{border-color:var(--acc2);box-shadow:0 0 0 2px var(--acc2)}
.sw{aspect-ratio:1;border-radius:12px;border:2px solid #000}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--sub)}
.in{font-family:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:#101014;color:var(--text);width:100%}
textarea.in{resize:none;height:90px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.cnt-hint{text-align:right;font-size:12px;color:var(--sub)}
.bubble{background:#fff;color:#222;border:2px solid #000;border-radius:10px;padding:10px 14px;font-size:15px;position:relative;max-width:260px;text-align:center;line-height:1.4}
.bubble:after{content:'';position:absolute;left:50%;bottom:-12px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.note{background:#3a3210;border:2px solid #7a6a20;color:#ffe9a0;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}
.foot{color:#5c5c68;font-size:11px;text-align:center;margin-top:auto}
/* 관리자 */
h2{font-size:18px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.li canvas{height:60px;width:auto;flex:0 0 auto}
.li .tx{flex:1;min-width:0}
.li .tx p{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.tog input{width:22px;height:22px}
.url{font-size:12px;color:var(--sub);word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
/* 큰 화면 */
body.screen{overflow:hidden;height:100vh}
body.screen #app{display:flex;width:100vw;height:100vh}
.stage{position:relative;flex:1;height:100vh;overflow:hidden;background:#78b84a}
.world{position:absolute;inset:0;width:100%;height:100%}
.qrbox{position:absolute;left:2vh;top:2vh;background:#fff;padding:1.2vh;border-radius:1.4vh;border:.4vh solid #1d1b22;text-align:center;color:#1d1b22;box-shadow:0 .6vh 0 rgba(0,0,0,.35)}
.qrbox .qr img,.qrbox .qr canvas{width:16vh!important;height:16vh!important;display:block}
.qrt{font-size:1.9vh;margin-top:.8vh;font-weight:700}
.titlebar{position:absolute;left:50%;bottom:2.2vh;transform:translateX(-50%);background:rgba(20,18,26,.85);border:.3vh solid #000;border-radius:99px;padding:1.1vh 3vh;display:flex;gap:2vh;align-items:center;white-space:nowrap;font-size:2.6vh}
.titlebar .cnt{color:var(--acc2);font-size:2vh}
.fsbtn{position:absolute;right:1.5vh;top:1.5vh;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;opacity:.55}
.demotag{position:absolute;right:1.5vh;bottom:1.5vh;background:#ffd257;color:#2a2000;border-radius:8px;padding:4px 10px;font-size:12px}
.panel{width:26vw;max-width:460px;min-width:260px;height:100vh;background:#f5f2ea;color:#1d1b22;display:flex;flex-direction:column;border-left:.5vh solid #1d1b22}
.panel-h{padding:2vh 2.2vh;font-size:2.4vh;font-weight:700;border-bottom:.3vh solid #1d1b22;background:#ffd257}
.cards{flex:1;overflow:hidden;display:flex;flex-direction:column}
.card{display:flex;gap:1.6vh;align-items:center;padding:1.4vh 2vh;border-bottom:.25vh solid #d9d2c2}
.card canvas{height:10.5vh;width:auto;flex:0 0 auto;background:#e7e0cf;border-radius:1vh}
.card b{display:block;font-size:2.3vh;margin-bottom:.6vh}
.card p{font-size:1.9vh;color:#4a4552;line-height:1.4;word-break:keep-all}
.card.new{animation:pop .6s ease-out;background:#fff6cf}
@keyframes pop{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>

  const fc = () => FL[Math.floor(r() * FL.length)];

    const blobs = [[0, -rad * .4, rad * .75], [-rad * .6, rad * .3, rad * .7], [rad * .6, rad * .3, rad * .7], [0, 0, rad]];

    for (let i = 0; i < 40; i++) P(tx + (r() - .5) * rad * 1.6, ty + (r() - .5) * rad * 1.4, '#6cc25e');
  };
  x.fillStyle = '#78b84a'; x.fillRect(0, 0, W, H);
  const GS = ['#84c257', '#6ba63f', '#8fcb61', '#72ae45'];
  for (let i = 0; i < 4000; i++) P(r() * W, r() * H, GS[i % 4]);

  for (let yy = 44; yy <= 94; yy++) for (let xx = 166; xx <= 314; xx++) { const e = ((xx - 240) / 72) ** 2 + ((yy - 72) / 21) ** 2; if (e < 1) P(xx, yy, r() < .08 ? '#d9c896' : '#eadfb9'); }
  for (let yy = 86; yy < H; yy++) { const w = Math.round(Math.sin(yy * .13) * 1.3); for (let xx = 213 + w; xx <= 267 - w; xx++) P(xx, yy, r() < .07 ? '#d9c896' : '#eadfb9'); }
  tree(34, 34, 24); tree(448, 36, 24); tree(118, 12, 16); tree(364, 12, 16);
  for (let i = 0; i < 90; i++) lav(i % 2 ? 8 + r() * 70 : W - 8 - r() * 70, 100 + r() * 165);
  for (let i = 0; i < 170; i++) { const fx = r() * W, fy = 60 + r() * (H - 60); if (fx > 205 && fx < 275) continue; flower(fx, fy, fc()); }
  for (let yy = 96; yy < H + 4; yy += 5) { flower(208 + r() * 3, yy + r() * 2, fc()); flower(270 + r() * 3, yy + r() * 2, fc()); if (r() < .5) { P(206 + r() * 4, yy + 3, '#4c8a2e', 2, 1); P(271 + r() * 4, yy + 3, '#4c8a2e', 2, 1); } }

  P(202, 26, '#cfc5ad', 6, 46); P(203, 26, '#f4efe4', 4, 46); P(272, 26, '#cfc5ad', 6, 46); P(273, 26, '#f4efe4', 4, 46);
  for (let i = 0; i < 5; i++) { P(208 + i, 24 + i * 2, 'rgba(255,255,255,.7)', 1, 44 - i * 2); P(271 - i, 24 + i * 2, 'rgba(255,255,255,.7)', 1, 44 - i * 2); }
  for (let a = 0; a <= Math.PI + .01; a += 0.09) { const ax = 240 + Math.cos(a) * 36, ay = 28 - Math.sin(a) * 22; P(ax - 2, ay - 1, '#3f8f3c', 5, 4); P(ax - 1, ay - 2, '#56a84c', 3, 1); }

    wrap.innerHTML = ''; const w = W(6); w.className = 'pv';
    wrap.append(h('div', { class: 'g-title g-t', style: 'margin-top:20px' }, settings.title), h('div', { class: 'g-sub g-s' }, settings.subtitle),
      h('div', { class: 'pvwrap', style: 'margin:10px 0' }, w, h('div', { class: 'g-sub' }, '① 캐릭터 꾸미기 → ② 축하 한마디 → ③ 큰 화면에서 움직이며 대화!')),
      myId ? h('button', { class: 'btn full', onclick: play }, '🎮 ' + name + ' 캐릭터로 돌아가기') : null,
      h('button', { class: 'btn full' + (myId ? ' ghost' : ''), onclick: () => { if (myId) { myId = null; saveMe(null); cfg = randCfg(); name = ''; } build(); } }, myId ? '새 캐릭터로 입장하기' : '캐릭터 만들기 →'));
  }
  function build() {
    wrap.innerHTML = ''; const b = h('div');
    wrap.append(h('div', { class: 'g-title' }, '나랑 닮게 꾸며요'), b, h('div', { class: 'row' }, h('button', { class: 'btn ghost', onclick: intro }, '← 처음'), h('button', { class: 'btn', onclick: write }, '다음 →')));
    mountBuilder(b, cfg);
  }
  function write() {
    wrap.innerHTML = ''; const w = W(4); w.style.cssText = 'height:128px;width:auto';
    const ni = h('input', { class: 'in', maxlength: '10', placeholder: '이름 (예: 김하늘)' }); ni.value = name;
    const mi = h('textarea', { class: 'in', maxlength: '40', placeholder: '첫 인사를 남겨주세요' }); mi.value = msg;
    const cnt = h('div', { class: 'cnt-hint' }, msg.length + '/40'); mi.addEventListener('input', () => { cnt.textContent = mi.value.length + '/40'; });
    const go = h('button', { class: 'btn' }, '입장하기 🎉');
    go.onclick = async () => {
      name = ni.value.trim(); msg = mi.value.trim();
      if (!name) { ni.focus(); toast('이름을 적어주세요'); return; }
      if (!msg) { mi.focus(); toast('한마디를 적어주세요'); return; }
      go.disabled = true; go.textContent = '입장 중...';
      try { myId = await Store.addGuest({ name, msg, cfg: { ...cfg } }); saveMe({ id: myId, name, cfg }); play(); }
      catch (e) { go.disabled = false; go.textContent = '입장하기 🎉'; toast('전송 실패, 다시 눌러주세요'); }
    };
    wrap.append(h('div', { class: 'g-title' }, '첫 인사'), h('div', { class: 'center' }, w), h('label', { class: 'f' }, '이름', ni), h('label', { class: 'f' }, '메시지', mi, cnt),
      h('div', { class: 'row' }, h('button', { class: 'btn ghost', onclick: () => { name = ni.value; msg = mi.value; build(); } }, '← 꾸미기'), go));
  }
  /* 조종기: 조이스틱 + 말하기 + 포즈 */
  function play() {
    wrap.innerHTML = '';
    const gone = () => { toast('캐릭터가 삭제됐어요. 다시 입장해 주세요'); myId = null; saveMe(null); intro(); };
    const push = patch => Store.updateGuest(myId, patch).catch(e => { if (String(e.message) === 'gone') gone(); });
    const syncCfg = () => { saveMe({ id: myId, name, cfg }); push({ cfg: normCfg(cfg) }); };
    const me = W(4);
    // 조이스틱
    const knob = h('div', { class: 'knob' }), pad = h('div', { class: 'joy' }, knob);
    let cur = '0,0', hb = null, pid = null;
    const send = (dx, dy) => { const k = dx + ',' + dy; if (k === cur) return; cur = k; push({ dir: { dx, dy }, dt: Date.now() }); clearInterval(hb); if (dx || dy) hb = setInterval(() => push({ dir: { dx, dy }, dt: Date.now() }), 3000); };
    const moveTo = ev => {
      const r = pad.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let x = ev.clientX - cx, y = ev.clientY - cy; const d = Math.hypot(x, y), max = r.width / 2 - 36;
      if (d > max) { x = x / d * max; y = y / d * max; }
      knob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      if (d < 18) return send(0, 0);
      const a = Math.round(Math.atan2(y, x) / (Math.PI / 4)) * (Math.PI / 4);
      send(Math.round(Math.cos(a)), Math.round(Math.sin(a)));
    };
    const release = () => { pid = null; knob.style.transform = ''; send(0, 0); };
    pad.addEventListener('pointerdown', e => { pid = e.pointerId; pad.setPointerCapture(pid); moveTo(e); e.preventDefault(); });
    pad.addEventListener('pointermove', e => { if (e.pointerId === pid) moveTo(e); });
    pad.addEventListener('pointerup', release); pad.addEventListener('pointercancel', release);
    // 말하기
    const mi = h('input', { class: 'in', maxlength: '40', placeholder: '하고 싶은 말을 써 보세요', enterkeyhint: 'send' });
    let lastSend = 0;
    const say = async () => {
      const t = mi.value.trim(); if (!t) { mi.focus(); return; }
      if (Date.now() - lastSend < 1500) { toast('조금만 천천히요 🙂'); return; }
      lastSend = Date.now(); mi.value = '';
      await push({ msg: t.slice(0, 40), mt: Date.now() }); toast('큰 화면에 말풍선이 떴어요!');
    };
    mi.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); say(); } });
    const quick = ['축하해요! 🎉', '사랑해요 💛', '안녕하세요~', '대박 👍', 'ㅋㅋㅋㅋ'];
    // 포즈
    const chips = h('div', { class: 'chips' });
    const drawChips = () => { chips.innerHTML = ''; POSE_NAMES.forEach((nm, i) => chips.append(h('button', { class: 'chip' + (cfg.pose === i ? ' on' : ''), onclick: () => { cfg.pose = i; drawChips(); syncCfg(); } }, nm))); };
    drawChips();
    wrap.append(
      h('div', { class: 'me' }, me, h('div', {}, h('div', { class: 'g-title', style: 'text-align:left;font-size:20px' }, name), h('div', { class: 'g-sub', style: 'text-align:left' }, '큰 화면에서 내 이름이 노랗게 빛나요'))),
      h('div', { class: 'box' }, h('h2', {}, '🕹 움직이기'), pad, h('div', { class: 'g-sub' }, '노란 버튼을 끌어서 걸어 다녀요')),
      h('div', { class: 'box' }, h('h2', {}, '💬 말하기'), h('div', { class: 'sendrow' }, mi, h('button', { class: 'btn', onclick: say }, '보내기')),
        h('div', { class: 'chips' }, quick.map(q => h('button', { class: 'chip', onclick: () => { mi.value = q; say(); } }, q)))),
      h('div', { class: 'box' }, h('h2', {}, '🙌 포즈 바꾸기'), chips),
      h('div', { class: 'row' }, h('button', { class: 'btn ghost', onclick: () => openBuilder(cfg, () => { drawChips(); syncCfg(); }) }, '👕 다시 꾸미기'), h('button', { class: 'btn ghost', onclick: intro }, '처음 화면'))
    );
  }
  myId ? play() : intro();
}

/* ---------- 관리자 ---------- */
function startAdmin() {
  if (ADMIN_PIN) {
    let ok = false; try { ok = sessionStorage.getItem('pg_pin') === ADMIN_PIN; } catch (e) { }
    if (!ok) { const p = prompt('관리자 PIN'); if (p !== ADMIN_PIN) { app.textContent = 'PIN이 맞지 않아요'; return; } try { sessionStorage.setItem('pg_pin', p); } catch (e) { } }
  }
  document.body.className = 'mobile';
  const wrap = h('div', { class: 'phone wide' }); app.innerHTML = ''; app.append(wrap);
  let settings = fixSettings(null), loaded = false, hosts = [];
  const f = {
    title: h('input', { class: 'in', maxlength: '30' }), subtitle: h('input', { class: 'in', maxlength: '40' }),
    bubbleSec: h('select', { class: 'in' }, [5, 8, 12, 20].map(n => h('option', { value: String(n) }, n + '초'))),
    hostCount: h('select', { class: 'in' }, h('option', { value: '0' }, '없음'), h('option', { value: '1' }, '1명'), h('option', { value: '2' }, '2명')),
    showPanel: h('input', { type: 'checkbox' }), showQR: h('input', { type: 'checkbox' }), randomBubbles: h('input', { type: 'checkbox' })
  };
  const hostBox = h('div', { class: 'list' });
  function renderHosts() {
    const n = +f.hostCount.value;
    while (hosts.length < n) hosts.push({ name: hosts.length ? '주인공2' : '주인공', cfg: randCfg() });
    hosts.length = n; hostBox.innerHTML = '';
    hosts.forEach(ho => {
      const cv = h('canvas', { style: 'height:90px;width:auto' }); drawSpriteTo(cv, ho.cfg, 'p0', 3);
      const ni = h('input', { class: 'in', maxlength: '10', placeholder: '이름' }); ni.value = ho.name; ni.oninput = () => ho.name = ni.value;
      hostBox.append(h('div', { class: 'li' }, cv, h('div', { class: 'tx' }, ni), h('button', { class: 'btn ghost', style: 'padding:10px 12px;font-size:14px', onclick: () => openBuilder(ho.cfg, () => drawSpriteTo(cv, ho.cfg, 'p0', 3)) }, '꾸미기')));
    });
  }
  f.hostCount.onchange = renderHosts;
  Store.onSettings(s => {
    settings = s; if (loaded) return; loaded = true;
    f.title.value = s.title; f.subtitle.value = s.subtitle; f.bubbleSec.value = String(s.bubbleSec);
    f.showPanel.checked = s.showPanel; f.showQR.checked = s.showQR; f.randomBubbles.checked = s.randomBubbles;
    hosts = s.hosts.map(x => ({ name: x.name, cfg: { ...x.cfg } })); f.hostCount.value = String(hosts.length); renderHosts();
  });
  const save = h('button', { class: 'btn full' }, '설정 저장');
  save.onclick = async () => {
    const s = { title: f.title.value.trim() || DEFAULT_SETTINGS.title, subtitle: f.subtitle.value.trim(), hostCount: hosts.length, hosts: hosts.map(x => ({ name: x.name.trim(), cfg: normCfg(x.cfg) })), showPanel: f.showPanel.checked, showQR: f.showQR.checked, randomBubbles: f.randomBubbles.checked, bubbleSec: +f.bubbleSec.value || 8 };
    save.disabled = true;
    try { await Store.saveSettings(s); toast('저장했어요 · 큰 화면에 바로 반영돼요'); } catch (e) { toast('저장 실패: ' + e.message); }
    save.disabled = false;
  };
  const copy = u => { (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('주소를 복사했어요')).catch(() => prompt('복사해서 쓰세요', u)); };
  const gmap = new Map(), list = h('div', { class: 'list' }), cntEl = h('span', {}, '0');
  function renderList() {
    list.innerHTML = ''; const arr = [...gmap.values()].sort((a, b) => (b.t || 0) - (a.t || 0)); cntEl.textContent = arr.length;
    if (!arr.length) list.append(h('div', { class: 'g-sub', style: 'text-align:left' }, '아직 입장한 하객이 없어요'));
    arr.forEach(g => { const cv = h('canvas'); drawSpriteTo(cv, g.cfg, 'p0', 2); list.append(h('div', { class: 'li' }, cv, h('div', { class: 'tx' }, h('b', {}, g.name), h('p', {}, g.msg)), h('button', { class: 'btn ghost', style: 'padding:8px 12px;font-size:13px', onclick: () => { if (confirm(g.name + '님의 캐릭터를 삭제할까요?')) Store.removeGuest(g.id); } }, '삭제'))); });
  }
  let rt; const sched = () => { clearTimeout(rt); rt = setTimeout(renderList, 80); };
  Store.onGuests(g => { gmap.set(g.id, g); sched(); }, id => { gmap.delete(id); sched(); }, g => { gmap.set(g.id, g); sched(); });
  renderList();
  const NAMES = ['김하늘', '이서준', '박지민', '최유나', '정민호', '강다은', '조현우', '윤서아', '장도윤', '임하린', '한지호', '오세린', '서예준', '신수아', '권태오', '황보람', '안채원', '송민재', '류지후', '홍나리'];
  const MSGS = ['축하해요!!', '오늘 너무 멋져요 ✨', '행복하게 오래오래~', '와 이거 진짜 신기하다 ㅋㅋ', '최고의 하루 되세요', '사랑해요 💛', '캐릭터 나랑 똑같음', '초대해줘서 고마워요', '앞날을 응원합니다!', '꽃길만 걷자 🌸'];
  const testBtn = h('button', { class: 'btn ghost' }, '테스트 하객 20명');
  testBtn.onclick = async () => { testBtn.disabled = true; for (let i = 0; i < 20; i++) { await Store.addGuest({ name: NAMES[i], msg: MSGS[ri(MSGS.length)], cfg: randCfg() }); await sleep(400); } testBtn.disabled = false; };
  const clearBtn = h('button', { class: 'btn danger', onclick: () => { if (confirm('모든 하객 캐릭터를 지울까요? 되돌릴 수 없어요.')) Store.clearGuests(); } }, '전체 삭제');
  const linkRow = (label, u, btn) => h('div', {}, h('b', {}, label), h('div', { class: 'url', style: 'margin:4px 0 8px' }, u), btn);
  wrap.append(
    h('h2', {}, '⚙️ 픽셀 방명록 관리자 · 방 [' + ROOM + ']'),
    Store.fb ? null : h('div', { class: 'note' }, '체험 모드예요. 이 브라우저 안에서만 동작하니, 같은 브라우저의 다른 탭에 큰 화면과 하객 화면을 열어 테스트해 보세요. 실제 행사에서는 코드 상단의 FIREBASE_CONFIG를 채워 주세요.'),
    h('div', { class: 'box' },
      linkRow('🖥 큰 화면 (TV·빔프로젝터)', urlFor('screen'), h('button', { class: 'btn ghost full', onclick: () => window.open(urlFor('screen'), '_blank') }, '큰 화면 열기')),
      linkRow('📱 하객 입장 주소 (큰 화면 QR과 같음)', urlFor('guest'), h('div', { class: 'row' }, h('button', { class: 'btn ghost', onclick: () => copy(urlFor('guest')) }, '주소 복사'), h('button', { class: 'btn ghost', onclick: () => window.open(urlFor('guest'), '_blank') }, '열어보기')))),
    h('div', { class: 'box' }, h('h2', {}, '행사 설정'),
      h('label', { class: 'f' }, '행사 제목 (큰 화면 하단)', f.title),
      h('label', { class: 'f' }, '하객 화면 안내 문구', f.subtitle),
      h('label', { class: 'f' }, '꽃 아치 아래 주인공', f.hostCount), hostBox,
      h('label', { class: 'tog' }, '오른쪽 메시지 패널', f.showPanel),
      h('label', { class: 'tog' }, 'QR 코드 표시', f.showQR),
      h('label', { class: 'tog' }, '랜덤 말풍선 (입장한 하객 메시지 다시 보여주기)', f.randomBubbles),
      h('label', { class: 'f' }, '입장 말풍선 유지 시간', f.bubbleSec), save),
    h('div', { class: 'box' }, h('h2', {}, '하객 ', cntEl, '명'), h('div', { class: 'row' }, testBtn, clearBtn), list)
  );
}

/* ---------- 첫 화면 ---------- */
function startHome() {
  document.body.className = 'mobile';
  const wrap = h('div', { class: 'phone' }); app.innerHTML = ''; app.append(wrap);
  const ri2 = h('input', { class: 'in', maxlength: '30' }); ri2.value = ROOM;
  const go = m => { const r = (ri2.value || 'main').replace(/[^a-zA-Z0-9_-]/g, '') || 'main'; location.href = location.pathname + '?room=' + r + '&mode=' + m; };
  const c = randCfg(); const w = walker(() => c, 6); w.className = 'pv';
  wrap.append(
    h('div', { class: 'g-title', style: 'margin-top:24px' }, '픽셀 방명록'),
    h('div', { class: 'g-sub' }, '하객이 픽셀 캐릭터가 되어 꽃길로 입장하는 실시간 방명록'),
    h('div', { class: 'pvwrap' }, w),
    h('label', { class: 'f' }, '방 이름 (행사마다 다르게 · 영문/숫자)', ri2),
    h('button', { class: 'btn full', onclick: () => go('screen') }, '🖥 큰 화면 열기'),
    h('button', { class: 'btn ghost full', onclick: () => go('guest') }, '📱 하객 입장 화면'),
    h('button', { class: 'btn ghost full', onclick: () => go('admin') }, '⚙️ 관리자'),
    Store.fb ? null : h('div', { class: 'note' }, '지금은 체험 모드예요. 같은 브라우저에서 탭을 나눠 테스트할 수 있어요.'),
    h('div', { class: 'foot' }, '© 에듀테크리더스 · edu@eduleader.kr')
  );
}

(async () => {
  await Store.init();
  if (MODE === 'screen') startScreen();
  else if (MODE === 'guest') startGuest();
  else if (MODE === 'admin') startAdmin();
  else startHome();
})();
</script>
